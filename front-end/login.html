<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Doceria Gourmet IANES</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container-login">

        <h1>Doceria Gourmet IANES</h1>

        <form class="form-login">

            <h2>Login</h2>

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="button" onclick="login()">
                Entrar
            </button>

        </form>

    </div>

    <script src="./login.js"></script>

</body>
</html>
